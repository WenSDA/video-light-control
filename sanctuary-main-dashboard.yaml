        # Houselights
        
          - type: image
            entity: light.houselights
            image: >-
              data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'
              viewBox='0 0 10 30'%3E%3C/svg%3E
            tap_action:
              action: more-info
            double_tap_action:
              action: toggle
            style:
              top: 20%
              left: 15%
              width: 5%
              height: 20%
            card_mod:
              style: |
                :host {
                  /* This watches your toggle helper. If it's on, it injects the colors. */
                  {% if is_state('input_boolean.layout_mode', 'on') %}
                  background-color: rgba(255, 0, 0, 0.4) !important;
                  border: 2px solid yellow !important;
                  {% endif %}
                }
